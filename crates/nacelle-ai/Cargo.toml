[package]
name = "nacelle-ai"
description = "The nacelle AI agent as a daemon: a Unix socket, the v0 JSON Lines protocol, and nothing done unasked"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The daemon's logic lives in a library so the tests can drive it over a
# pair of connected streams without a listening socket. The name differs
# from the package because the CORE's library is already `nacelle_ai`.
[lib]
name = "nacelle_ai_daemon"
path = "src/lib.rs"

[[bin]]
name = "nacelle-ai"
path = "src/main.rs"

[dependencies]
# The agent itself: credentials, the backends, the tools, the loop, the
# confidentiality line. Nothing in this crate re-implements any of it —
# this crate is the DOOR: a socket, a protocol, and the policy that the
# daemon does nothing without a command.
nacelle-ai-core = { workspace = true }

# The protocol is JSON Lines, one object per line, both directions.
serde_json = { workspace = true }
